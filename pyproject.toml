[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pokedex-flet"
version = "0.1.0"
description = "Pokédex interactiva en Python + Flet + PokeAPI"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "flet",
    "httpx",
    "pydantic",
]

[project.scripts]
pokedex = "app.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=6.0.0",
    "respx>=0.23.1",
    "ruff>=0.16.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov --cov-report=term-missing --cov-fail-under=70"

[tool.coverage.run]
source = ["app/services", "app/models"]
branch = false
omit = ["*/__init__.py"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest-asyncio]
asyncio_mode = "auto"
