name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-linux:
    name: Build Linux executable
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.14

      - name: Sync dependencies
        run: uv sync --no-dev

      - name: Build Linux app
        # Descarga e instala Flutter automáticamente en el primer build.
        run: uv run flet build linux -o dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pokedex-linux
          path: dist/
          if-no-files-found: error
